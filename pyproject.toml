[project]
name = "cvr"
version = "0.1.0"
description = "Reformats a candidate CV (.docx) into a branded template without changing a word of the candidate's text."
authors = [
    { name = "Kieran O Flynn", email = "6141875+KOFlynn@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8,<2",
    "docxtpl",
    "fastapi>=0.141,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-anthropic>=1.0,<2.0",
    "langfuse>=5.0,<6",
    "langgraph>=1.2,<2.0",
    "lxml",
    "pydantic",
    "python-docx",
    "python-multipart>=0.0.32,<0.1",
    "uvicorn>=0.54,<1.0",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pyyaml>=6.0.3",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff defaults (E4, E7, E9, F), import sorting and the banned-api rule.
extend-select = ["I", "TID251"]

[tool.ruff.lint.per-file-ignores]
# Pydantic copies a field default per instance, so the bare [] is safe here.
"src/cvr/models/feedback.py" = ["RUF012"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"langfuse.langchain".msg = "The Langfuse LangChain callback handler is never attached: it would capture prompts behind the payload allowlist (ticket 07)."
"langfuse.decorators".msg = "The Langfuse decorator opens spans behind the payload allowlist (ticket 07); use cvr.tracing."
"langfuse.observe".msg = "The Langfuse decorator opens spans behind the payload allowlist (ticket 07); use cvr.tracing."
"langfuse.openai".msg = "The Langfuse OpenAI wrapper traces calls behind the payload allowlist (ticket 07)."

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests over all 48 generated documents are the slow suite: excluded by
# default, run with `-m slow`, and run by CI on every push.
addopts = ["-m", "not slow"]
markers = ["slow: runs over all 48 generated documents; `uv run pytest -m slow`"]
