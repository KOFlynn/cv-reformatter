[project]
name = "cvr"
version = "0.1.0"
description = "Reformats a candidate CV (.docx) into a branded template without changing a word of the candidate's text."
authors = [
    { name = "Kieran O Flynn", email = "kieranoflynn.work@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8,<2",
    "docxtpl",
    "langchain>=1.0,<2.0",
    "langchain-anthropic>=1.0,<2.0",
    "lxml",
    "pydantic",
    "python-docx",
]

[dependency-groups]
dev = [
    "pytest",
    "pyyaml>=6.0.3",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff defaults (E4, E7, E9, F) plus import sorting.
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests over all 48 generated documents are the slow suite: excluded by
# default, run with `-m slow`, and run by CI on every push.
addopts = ["-m", "not slow"]
markers = ["slow: runs over all 48 generated documents; `uv run pytest -m slow`"]
