name: CI

# A push that changes only docs runs nothing: on main it would pay for an
# uncached eval (about $3.30) and redeploy an unchanged image. Pull requests
# always run every job, since branch protection waits on `check` and `eval`
# and a check skipped by a path filter never reports.
on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".scratch/**"
  pull_request:

# Least privilege for every job; `eval` adds pull-requests: write, for its report
# comment, and `deploy` adds packages: write and id-token: write, for GHCR and OIDC.
permissions:
  contents: read

# One run per event and ref: a newer push cancels the older run still going, so
# two quick pushes to a PR branch never pay for two full eval runs. The event
# is in the group because a push to a PR branch starts a `push` run and a
# `pull_request` run together; without it they would cancel each other.
# Pushes to main are never cancelled: each merge gets its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Interpreter version comes from .python-version so local and CI match.
      - name: Install Python
        run: uv python install

      - name: Sync
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      # The tests over all 48 generated documents, excluded from the default
      # run by the marker; still run on every push.
      - name: Slow tests (all 48 generated documents)
        run: uv run pytest -m slow

  # The gate in front of every merge: the real labeller over all 48 generated
  # documents against eval/thresholds.yaml. Needs the repository secret
  # ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).
  eval:
    needs: check
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync
        run: uv sync --locked

      # The response cache is keyed inside on the labeller config, the prompt
      # and schema hashes and each source document's sha256, so a restored
      # entry can only answer the exact question it was made for; a changed
      # prompt, schema, model or document misses and pays for a live call.
      # Saved only when the job succeeds, so a failed run's answers are never
      # replayed to make the re-run fail the same way.
      - name: Eval response cache
        uses: actions/cache@v4
        with:
          path: .cache/eval-responses
          key: eval-responses-${{ github.sha }}
          restore-keys: eval-responses-

      - name: Check the API key is present
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=ANTHROPIC_API_KEY is not set::The eval gate needs the repository secret ANTHROPIC_API_KEY. Add it under Settings > Secrets and variables > Actions. Pull requests from forks never receive secrets, so they cannot pass this gate."
            exit 1
          fi

      # Exit 1 on any hard-gate breach or missed threshold; the steps after
      # this one run regardless (if: always()) because the report matters most
      # when the gate fails. A push to main is the authoritative live run:
      # every document is labelled afresh (--no-cache) and the cache refreshed.
      - name: Eval
        env:
          EVAL_ARGS: ${{ github.event_name == 'push' && '--no-cache' || '' }}
        run: uv run python -m cvr.eval.run $EVAL_ARGS

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval/report.json
            eval/report.md
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          if [ -f eval/report.md ]; then
            cat eval/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The eval wrote no report; see the Eval step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      # One comment per PR, found by its hidden marker and edited on re-runs.
      # Skipped for PRs from forks, whose token is read-only.
      - name: PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- cvr-eval-report -->'
          {
            echo "$marker"
            if [ -f eval/report.md ]; then
              head -c 60000 eval/report.md
            else
              echo "# Eval report"
              echo
              echo "**No report was written**; the eval failed before scoring."
            fi
            echo
            echo "[Run $GITHUB_RUN_ID]($RUN_URL) at ${GITHUB_SHA::7}; the full report.json is the eval-report artifact."
          } > comment.md
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.body | startswith("<!-- cvr-eval-report -->")) | .id' | sed -n 1p)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi

  # Ships what the gate passed: on a push to main, after eval, the image goes
  # to GHCR and the container app is moved to it. Azure trusts this job
  # through an OIDC federated credential whose subject is this repository's
  # main branch, so GitHub holds no Azure secret: the three ids it logs in
  # with are repository variables, identifiers rather than credentials. The
  # resources are provisioned once by scripts/provision-azure.sh (ADR-0010).
  deploy:
    needs: eval
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy at a time, never cancelled: a second merge's deploy waits,
    # so an older commit can never land after a newer one.
    concurrency:
      group: deploy
      cancel-in-progress: false
    # id-token only here, at job level: the one job that talks to Azure.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # GHCR names must be lower case; the repository's owner is not.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      # Tagged by commit only: every revision names the exact source it runs.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # The package is public (no registry secret on the Container Apps side),
      # so the pushed image must pull with no credentials at all; then ticket
      # 12's inspection runs again on what was actually published: no key in
      # its history or filesystem, no golden or eval package, /health answers.
      - name: Pull anonymously and inspect the published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          docker logout ghcr.io
          PULL=1 sh scripts/check-image.sh

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # A new revision on the new image; everything else (ingress, probes,
      # scale, the key as a Container Apps secret) is as provisioned.
      - name: Deploy
        id: deploy
        env:
          APP: ${{ vars.AZURE_CONTAINER_APP }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          az containerapp update --name "$APP" --resource-group "$RG" \
            --image "$IMAGE" --only-show-errors --output none
          fqdn=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query properties.configuration.ingress.fqdn --output tsv)
          [ -n "$fqdn" ] || { echo "::error::$APP has no ingress FQDN"; exit 1; }
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      # One golden-set document through the live endpoint, through the cold
      # start: a .docx back with X-Run-Id, so the header survives ingress.
      # Calls the real model once (a few cents).
      - name: Smoke test the live endpoint
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: sh scripts/smoke-deploy.sh "$URL"
