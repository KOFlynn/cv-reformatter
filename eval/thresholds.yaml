# The eval gate's soft thresholds, read by `python -m cvr.eval.run`.
#
# PLACEHOLDERS. These admit everything; ticket 10 (baseline and thresholds)
# sets them from three baseline runs on the default LabellerConfig and
# records the arithmetic in the dated baseline beside this file.
#
# The hard gates are not here and cannot be loosened: added, dropped,
# provenance, PII and image leaks at zero, ordering exactly right, and
# structural leaves (name, title, employer, location, dates, institution,
# qualification) at 100% precision and recall. Any labelling that errors
# fails the run too.
#
# Percentages, applied to the run's totals.

placement_accuracy:
  # Tunable leaves (profile, skills, bullets, details, certifications,
  # additional): precision and recall each at least this, never their F1.
  min: 0

appendix_rate:
  # Appendix tokens over source content tokens (the source less what was
  # removed), token-weighted over every document: at most this.
  max: 100

punctuation_fidelity:
  # Whether any punctuation finding fails the run. Promoted by ticket 10
  # only if all three baseline runs are clean.
  hard: false
